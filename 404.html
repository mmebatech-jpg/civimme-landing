<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable — Civimme</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@1,300&family=Azeret+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0A0A0A; color:#FFFFFF; font-family:'Azeret Mono', monospace; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
.spine { position:fixed; left:0; top:0; bottom:0; width:4px; background:#A8882A; }
.card { max-width:520px; text-align:center; }
.code { font-family:'Bebas Neue', sans-serif; font-size:96px; letter-spacing:6px; color:rgba(255,255,255,0.12); line-height:1; }
h1 { font-family:'Bebas Neue', sans-serif; font-size:44px; letter-spacing:3px; margin:8px 0 12px; }
p { font-family:'Cormorant Garamond', serif; font-style:italic; font-size:20px; color:rgba(255,255,255,0.65); margin-bottom:32px; }
a.btn { display:inline-block; background:#A8882A; color:#0A0A0A; font-family:'Bebas Neue', sans-serif; font-size:16px; letter-spacing:3px; padding:16px 36px; border-radius:2px; text-decoration:none; }
a.alt { display:block; margin-top:18px; font-size:11px; letter-spacing:2px; color:rgba(255,255,255,0.6); }
</style>
</head>
<body>
<div class="spine"></div>
<div class="card">
  <div class="code">404</div>
  <h1>PAGE INTROUVABLE</h1>
  <p>Le lien est peut-être incomplet ou ancien.</p>
  <a class="btn" href="/">RETOUR À L'ACCUEIL →</a>
  <a class="alt" href="https://app.civimme.com">OUVRIR L'APPLICATION</a>
</div>
</body>
</html>
